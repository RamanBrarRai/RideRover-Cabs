# Starts a local PostgreSQL database for development.
#   docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cab
      POSTGRES_PASSWORD: cabpass
      POSTGRES_DB: cab_dev
    ports:
      - "5432:5432"
    volumes:
      - cab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cab -d cab_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  cab_pgdata:
