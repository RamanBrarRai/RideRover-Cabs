<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RR Cabs – Outstation Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1F33; --orange:#FF8A00; --bg:#F7F9FC; --text:#111827; --muted:#5B6575;
  --ok:#16A34A; --card:#FFFFFF; --line:#E3E8F0; --warn:#B45309; --bad:#C62828;
  --page:#E9EEF5; --orange-ink:#8A4B00; --soft-orange:#FFF1DC; --soft-ok:#E3F6EA; --soft-bad:#FDE8E8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A28; --text:#EEF2F7; --muted:#9AA7B8; --card:#152638; --line:#24394F; --page:#07121D;
    --soft-orange:#3A2A10; --soft-ok:#12301F; --soft-bad:#3A1A1A; --orange-ink:#FFB454; --navy:#06121E;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A28; --text:#EEF2F7; --muted:#9AA7B8; --card:#152638; --line:#24394F; --page:#07121D;
  --soft-orange:#3A2A10; --soft-ok:#12301F; --soft-bad:#3A1A1A; --orange-ink:#FFB454; --navy:#06121E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--page);color:var(--text);font-family:'DM Sans','Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3{font-family:'Sora','DM Sans',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--navy);color:#fff;flex-wrap:wrap}
.top b{font-family:'Sora',sans-serif;font-size:17px}
.top b span{color:var(--orange)}
.roles{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:4px;border-radius:999px}
.roles button{background:transparent;color:#fff;padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px}
.roles button.on{background:var(--orange);color:#111827}
.stage{display:flex;justify-content:center;padding:20px 12px}
.phone{width:100%;max-width:400px;height:min(780px,calc(100vh - 110px));min-height:600px;background:var(--bg);border-radius:30px;border:8px solid var(--navy);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(11,31,51,.25)}
.screen{flex:1;overflow-y:auto;padding:16px}
.nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
.nav button{flex:1;background:none;padding:11px 0 12px;color:var(--muted);font-weight:700;font-size:13px}
.nav button.on{color:var(--navy);box-shadow:inset 0 3px 0 var(--orange)}
:root[data-theme="dark"] .nav button.on,:root:not([data-theme="light"]) .nav button.on{color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero h1{font-size:23px;line-height:1.2;margin-bottom:6px}
.hero p{margin:0;color:#C9D5E4;font-size:14px}
.hero svg{position:absolute;right:-6px;bottom:-4px;opacity:.9}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--page);padding:5px;border-radius:14px;margin-bottom:12px}
.seg button{background:transparent;padding:10px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
select,input[type=date],input[type=time],input[type=number],input[type=text],input[type=password],input[type=file]{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:12px}
.swap{display:flex;justify-content:center;margin:-6px 0 6px}
.swap button{background:var(--soft-orange);color:var(--orange-ink);border-radius:999px;padding:5px 14px;font-weight:700;font-size:13px}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--orange);color:#111827;font-weight:700;font-size:16px}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:11px}
.btn.bad{background:var(--soft-bad);color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--page);color:var(--muted)}
.pill.ok{background:var(--soft-ok);color:var(--ok)}
.pill.warn{background:var(--soft-orange);color:var(--orange-ink)}
.pill.bad{background:var(--soft-bad);color:var(--bad)}
.flex{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted);font-size:13px}
.big{font-family:'Sora',sans-serif;font-size:22px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:500}
.route{display:flex;align-items:flex-start;margin:12px 0 4px}
.stop{flex:1;text-align:center;position:relative;font-size:10.5px;color:var(--muted);min-width:0}
.stop i{display:block;width:12px;height:12px;border-radius:50%;background:var(--line);margin:0 auto 4px;position:relative;z-index:1}
.stop::before{content:"";position:absolute;top:5px;left:-50%;width:100%;height:3px;background:var(--line)}
.stop:first-child::before{display:none}
.stop.in i{background:var(--orange)}
.stop.in::before{background:var(--orange)}
.stop.in.first::before{background:var(--line)}
.stop.me{color:var(--text);font-weight:700}
.stepper{display:flex;gap:4px;margin:10px 0}
.stepper span{flex:1;height:6px;border-radius:4px;background:var(--line)}
.stepper span.on{background:var(--orange)}
.stepper.done span.on{background:var(--ok)}
.line{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.line.total{border-top:1.5px dashed var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:16px}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:34px;height:34px;border-radius:50%;background:var(--page);font-weight:700;font-size:18px}
.stars button{background:none;font-size:26px;color:var(--line);padding:0 2px}
.stars button.on{color:var(--orange)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;max-width:92%;font-weight:500;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3);border-left:5px solid var(--orange)}
.empty{text-align:center;padding:26px 10px}
.empty b{display:block;font-family:'Sora',sans-serif;font-size:17px;margin-bottom:4px}
.admin{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:200px 1fr;gap:16px}
.side{display:flex;flex-direction:column;gap:4px}
.side button{background:transparent;text-align:left;padding:10px 12px;border-radius:10px;font-weight:700;color:var(--muted)}
.side button.on{background:var(--card);color:var(--text);box-shadow:inset 4px 0 0 var(--orange)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .big{display:block;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-size:12.5px;padding:8px 6px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.drv-top{background:var(--navy);color:#fff;border-radius:20px;padding:16px;margin-bottom:14px}
.switch{position:relative;width:54px;height:30px;border-radius:999px;background:#445468;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(24px)}
@media (max-width:780px){
  .admin{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto}
  .side button{white-space:nowrap}
  .stage{padding:0}
  .phone{border-radius:0;border:0;height:calc(100vh - 100px);max-width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <b>RR <span>Cabs</span> <small style="font-weight:400;opacity:.7;font-size:12px">outstation prototype</small></b>
  <div class="roles" id="roles"></div>
</div>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ============ DATA ============ */
var CITIES={Mohali:[30.70,76.72],Chandigarh:[30.73,76.78],Panchkula:[30.69,76.85],Ambala:[30.38,76.78],Karnal:[29.69,76.99],Panipat:[29.39,76.97],Delhi:[28.61,77.21],Ludhiana:[30.90,75.85],Jalandhar:[31.33,75.58],Amritsar:[31.63,74.87],Jaipur:[26.91,75.79]};
var CITY_NAMES=Object.keys(CITIES).sort();
function hav(a,b){var R=6371,r=Math.PI/180,A=CITIES[a],B=CITIES[b];var dLa=(B[0]-A[0])*r,dLo=(B[1]-A[1])*r;var x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(A[0]*r)*Math.cos(B[0]*r)*Math.sin(dLo/2)*Math.sin(dLo/2);return 2*R*Math.asin(Math.sqrt(x))}
function road(a,b){if(a===b)return 0;return Math.round(hav(a,b)*1.06)}
function pad(n){return (n<10?'0':'')+n}
function dateStr(off){var d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function nice(ds){var p=ds.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}
function mins(t){var p=t.split(':');return +p[0]*60+ +p[1]}
function hrs(km){var m=Math.round(km/55*60);return Math.floor(m/60)+'h '+pad(m%60)+'m'}
function inr(n){return '₹'+Math.round(n).toLocaleString('en-IN')}
function uid(){return 'RR'+Math.floor(10000+Math.random()*89999)}

var S={
  role:'customer',cTab:'book',step:'home',aTab:'dashboard',busy:false,
  search:{from:'Mohali',to:'Delhi',date:dateStr(1),time:'06:00',mode:'personal',seats:1},
  view:'personal',cat:'Sedan',pay:'UPI',pick:null,
  pricing:{perKm:10.5,baseFare:150,minFare:1200,platformFee:49,commission:15,cancelFee:200,waitPerHr:150,tollPer100:60,suvMult:1.25,sharedFactor:0.3,minSeatFare:250,excellent:85,good:70,possible:50,radiusKm:30,windowMin:120},
  drivers:[
    {id:'d1',name:'Harjit Singh',vehicle:'Toyota Dzire',reg:'PB 65 AB 1234',rating:4.8,status:'VERIFIED',docs:{Licence:'ok',RC:'ok',Insurance:'ok',ID:'ok'}},
    {id:'d2',name:'Manoj Kumar',vehicle:'Maruti Ertiga',reg:'CH 01 BX 7788',rating:4.6,status:'VERIFIED',docs:{Licence:'ok',RC:'ok',Insurance:'ok',ID:'ok'}},
    {id:'d3',name:'Sandeep Yadav',vehicle:'Innova Crysta',reg:'HR 03 AK 4521',rating:4.9,status:'VERIFIED',docs:{Licence:'ok',RC:'ok',Insurance:'ok',ID:'ok'}},
    {id:'d4',name:'Gurmeet Dhillon',vehicle:'Honda Amaze',reg:'PB 10 CD 9012',rating:0,status:'PENDING_VERIFICATION',docs:{Licence:'ok',RC:'pending',Insurance:'pending',ID:'ok'}},
    {id:'d5',name:'Rakesh Sharma',vehicle:'Hyundai Aura',reg:'HR 26 DE 3344',rating:0,status:'PENDING_VERIFICATION',docs:{Licence:'pending',RC:'ok',Insurance:'ok',ID:'pending'}}
  ],
  rides:[
    {id:'S1',driver:'d1',from:'Mohali',to:'Delhi',route:['Mohali','Chandigarh','Ambala','Karnal','Panipat','Delhi'],date:dateStr(1),time:'06:00',cap:4,avail:2},
    {id:'S2',driver:'d2',from:'Chandigarh',to:'Delhi',route:['Chandigarh','Ambala','Karnal','Panipat','Delhi'],date:dateStr(1),time:'07:00',cap:6,avail:3},
    {id:'S3',driver:'d3',from:'Ambala',to:'Delhi',route:['Ambala','Karnal','Panipat','Delhi'],date:dateStr(1),time:'08:30',cap:6,avail:1},
    {id:'S4',driver:'d2',from:'Ludhiana',to:'Delhi',route:['Ludhiana','Ambala','Karnal','Panipat','Delhi'],date:dateStr(1),time:'05:30',cap:6,avail:4},
    {id:'S5',driver:'d1',from:'Delhi',to:'Mohali',route:['Delhi','Panipat','Karnal','Ambala','Chandigarh','Mohali'],date:dateStr(1),time:'14:00',cap:4,avail:3},
    {id:'S6',driver:'d3',from:'Chandigarh',to:'Amritsar',route:['Chandigarh','Ludhiana','Jalandhar','Amritsar'],date:dateStr(1),time:'09:00',cap:6,avail:5}
  ],
  bookings:[
    {id:'RR20411',mode:'personal',from:'Chandigarh',to:'Jaipur',date:dateStr(-6),time:'07:00',seats:1,cat:'Sedan',total:6200,fee:49,driverPay:5200,status:'TRIP_COMPLETED',driverId:'d1',pay:'SUCCESS',rated:5,seed:true},
    {id:'RR20388',mode:'shared',from:'Mohali',to:'Delhi',date:dateStr(-9),time:'06:00',seats:2,cat:'',total:1700,fee:98,driverPay:1400,status:'TRIP_COMPLETED',driverId:'d3',pay:'SUCCESS',rated:4,seed:true}
  ],
  audit:[{t:'Seed',who:'system',what:'Prototype data loaded'}],
  pricingLog:[]
};
S.user=null;S.driverId=null;S.adminIn=false;S.adminErr='';S.adminFails=0;S.adminLock=0;S.payErr='';S.upi='';S.failTest=false;
S.phones={'9876500001':'d1'};
S.lg={customer:{step:'intro',slide:0,phone:'',err:'',name:'',email:''},driver:{step:'phone',phone:'',err:''}};
S.txns=[{id:'TXN774201',booking:'RR20411',method:'UPI',amount:6200,status:'SUCCESS',time:'seed',type:'PAYMENT'},{id:'TXN774188',booking:'RR20388',method:'Card',amount:1700,status:'SUCCESS',time:'seed',type:'PAYMENT'}];
S.bookings.forEach(function(b){b.cust='Ananya';b.txnId='seed';b.method='UPI'});

/* ============ PRICING ============ */
function personalFare(km,cat){
  var p=S.pricing,mult=cat==='SUV'?p.suvMult:1;
  var dist=Math.max(p.minFare,p.baseFare+km*p.perKm*mult);
  var toll=Math.round(km/100*p.tollPer100);
  var fee=p.platformFee;
  return {km:km,dist:Math.round(dist),toll:toll,fee:fee,total:Math.round(dist+toll+fee),driverPay:Math.round((dist+toll)*(1-p.commission/100))};
}
function seatFare(km,seats){
  var p=S.pricing;
  var per=Math.max(p.minSeatFare,Math.round(km*p.perKm*p.sharedFactor));
  var fee=p.platformFee;
  return {km:km,perSeat:per,seats:seats,fee:fee*seats,total:(per+fee)*seats,driverPay:Math.round(per*seats*(1-p.commission/100)),each:per+fee};
}
/* ============ ROUTE MATCHING ============ */
function nearestOnRoute(city,route){
  var best=-1,bd=1e9;
  for(var i=0;i<route.length;i++){var d=hav(city,route[i]);if(d<bd){bd=d;best=i}}
  return {idx:best,dist:bd};
}
function matchRides(s){
  var p=S.pricing,userKm=road(s.from,s.to),out=[];
  S.rides.forEach(function(r){
    if(r.date!==s.date||r.avail<s.seats)return;
    var dr=S.drivers.filter(function(d){return d.id===r.driver})[0];
    if(!dr||dr.status!=='VERIFIED')return;
    var a=nearestOnRoute(s.from,r.route),b=nearestOnRoute(s.to,r.route);
    if(a.dist>p.radiusKm||b.dist>p.radiusKm||a.idx>=b.idx)return;
    var diff=Math.abs(mins(r.time)-mins(s.time));
    if(diff>p.windowMin)return;
    var seg=0;for(var i=a.idx;i<b.idx;i++)seg+=road(r.route[i],r.route[i+1]);
    var overlap=Math.min(1,seg/Math.max(userKm,1));
    var prox=Math.max(0,1-(a.dist+b.dist)/(2*p.radiusKm));
    var tm=Math.max(0,1-diff/p.windowMin);
    var score=Math.round(100*(0.55*overlap+0.25*prox+0.20*tm));
    if(score<p.possible)return;
    var label=score>=p.excellent?'Excellent match':score>=p.good?'Good match':'Possible match';
    var detour=Math.round((a.dist+b.dist)*1.06);
    out.push({ride:r,driver:dr,score:score,label:label,a:a.idx,b:b.idx,detour:detour,extraMin:Math.round(detour/50*60),diff:diff,fare:seatFare(userKm,s.seats)});
  });
  out.sort(function(x,y){return y.score-x.score});
  return out;
}
/* ============ HELPERS ============ */
function toast(msg){
  var t=document.getElementById('toast');t.innerHTML='<div class="toast" role="status">'+msg+'</div>';
  clearTimeout(toast.h);toast.h=setTimeout(function(){t.innerHTML=''},3200);
}
function drv(id){return S.drivers.filter(function(d){return d.id===id})[0]}
function badge(st){
  var c=st==='VERIFIED'||st==='TRIP_COMPLETED'||st==='SUCCESS'?'ok':(st==='REJECTED'||st==='SUSPENDED'||st==='CANCELLED'||st==='FAILED')?'bad':'warn';
  return '<span class="pill '+c+'">'+st.replace(/_/g,' ').toLowerCase()+'</span>';
}
var STATES=['REQUESTED','ACCEPTED','DRIVER_EN_ROUTE','ARRIVED','TRIP_STARTED','TRIP_COMPLETED'];
function stepper(st){
  var i=STATES.indexOf(st);if(st==='CANCELLED')return '';
  var h='<div class="stepper'+(st==='TRIP_COMPLETED'?' done':'')+'">';
  STATES.forEach(function(x,k){h+='<span class="'+(k<=i?'on':'')+'"></span>'});
  return h+'</div>';
}
function routeBar(r,a,b){
  var h='<div class="route">';
  r.route.forEach(function(c,i){
    var inn=i>=a&&i<=b,cls='stop'+(inn?' in':'')+(i===a?' first me':'')+(i===b?' me':'');
    h+='<div class="'+cls+'"><i></i>'+c+'</div>';
  });
  return h+'</div>';
}
function opts(sel,skip){return CITY_NAMES.filter(function(c){return c!==skip}).map(function(c){return '<option'+(c===sel?' selected':'')+'>'+c+'</option>'}).join('')}

/* ============ CUSTOMER ============ */
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
function maskPh(p){return p?'XXXXXX'+p.slice(-4):''}
function tid(){return 'TXN'+Math.floor(100000+Math.random()*899999)}
function docLabel(v){return v==='ok'?'verified':v.indexOf('uploaded:')===0?'uploaded ('+v.slice(9)+')':v}
function lgBox(title,sub,body){return '<div style="padding-top:8px"><div class="hero" style="margin-bottom:18px"><h1>'+title+'</h1><p>'+sub+'</p></div>'+body+'</div>'}
function errBox(e){return e?'<div class="pill bad" style="display:block;margin:0 0 12px;padding:9px 12px;border-radius:12px;font-size:13px">'+e+'</div>':''}
function authFlow(role){
  var L=S.lg[role],h='',err=errBox(L.err),isD=role==='driver';
  if(role==='customer'&&L.step==='intro'){
    var sl=[['Outstation rides, sorted','Book a full cab between cities, or share one with travellers going your way.'],['Share and save','We match by route, not just by city. A ride starting in Chandigarh can still pick you up in Mohali.'],['Verified drivers only','Every driver is document-checked before taking a single ride.']][L.slide];
    h=lgBox(sl[0],sl[1],'<div class="stepper" style="margin:0 0 16px">'+[0,1,2].map(function(i){return '<span class="'+(i<=L.slide?'on':'')+'"></span>'}).join('')+'</div><button class="btn" data-act="lgIntro">'+(L.slide<2?'Next':'Get started')+'</button>'+(L.slide<2?'<button class="btn ghost" style="margin-top:8px" data-act="lgSkipIntro">Skip</button>':''));
  }
  else if(L.step==='phone'){
    h=lgBox(isD?'Drive with RR Cabs':'Log in or sign up',isD?'Use your mobile number to log in or register as a driver.':'Enter your mobile number. We will text you a code.',err+'<div class="field"><label for="lg_phone">Mobile number</label><div style="display:flex;gap:8px"><span class="chip" style="display:flex;align-items:center">+91</span><input id="lg_phone" type="text" inputmode="numeric" maxlength="10" placeholder="10-digit number" value="'+L.phone+'"></div></div><button class="btn" data-act="lgPhone" data-role="'+role+'">Send code</button>'+(isD?'<div class="muted" style="margin-top:12px">Demo: 9876500001 logs in as an existing verified driver. Any other number starts a new registration.</div>':''));
  }
  else if(L.step==='otp'){

function customer(){
  if(!S.user)return '<div class="stage"><div class="phone"><div class="screen" id="scr">'+authFlow('customer')+'</div></div></div>';
  var h='<div class="phone"><div class="screen" id="scr">';
  if(S.cTab==='trips')h+=trips();
  else if(S.cTab==='profile')h+=profile();
  else if(S.step==='home')h+=home();
  else if(S.step==='results')h+=results();
  else if(S.step==='confirm')h+=confirm();

  else if(S.step==='failed')h+=failed();

}

    ['Sedan','SUV'].forEach(function(c){

    });
    if(m.length)h+='<div class="card" style="background:var(--soft-orange);border:0"><b>Want it cheaper?</b><div class="muted" style="color:var(--orange-ink)">Share a cab from '+inr(m[0].fare.each)+' per seat. '+m.length+' ride'+(m.length>1?'s':'')+' match your route.</div><button class="btn sm" style="margin-top:8px" data-act="view" data-v="shared">See shared rides</button></div>';
    h+='<button class="btn" data-act="toConfirm" data-kind="personal">Continue with '+S.cat+'</button>';

      h+=routeBar(r,x.a,x.b);

      h+='<div class="flex" style="margin-top:10px"><div><span class="big">'+inr(x.fare.each)+'</span> <span class="muted">per seat · '+r.avail+' of '+r.cap+' seats left</span></div></div>';
      h+='<button class="btn" style="margin-top:10px" data-act="pickRide" data-v="'+r.id+'">Book '+s.seats+' seat'+(s.seats>1?'s':'')+' · '+inr(x.fare.total)+'</button></div>';

  return h;

function currentOrder(){
  var s=S.search,km=road(s.from,s.to);
  if(S.pick&&S.pick.kind==='ride'){
    var r=S.rides.filter(function(x){return x.id===S.pick.id})[0],f=seatFare(km,s.seats);
    return {kind:'ride',ride:r,f:f,lines:[['Seat fare ('+km+' km × '+s.seats+')',inr(f.perSeat*s.seats)],['Platform fee',inr(f.fee)]],total:f.total,fee:f.fee,driverPay:f.driverPay,title:'Shared ride with '+drv(r.driver).name};
  }
  if(S.pick&&S.pick.kind==='publish'){
    var g=seatFare(km,s.seats);
    return {kind:'publish',f:g,lines:[['Seat fare ('+km+' km × '+s.seats+')',inr(g.perSeat*s.seats)],['Platform fee',inr(g.fee)]],total:g.total,fee:g.fee,driverPay:g.driverPay,title:'Your published shared journey'};
  }
  var p=personalFare(km,S.cat);

}

/* ============ DRIVER ============ */
function docsForm(d){
  var names={Licence:'Driving licence',RC:'Vehicle registration (RC)',Insurance:'Vehicle insurance',ID:'Identity proof'},ready=true;
  var h='<div class="card"><b>Upload your documents</b><div class="muted">Files go to private storage. Only RR Cabs reviewers can open them. We never keep your ID number.</div></div>';
  Object.keys(d.docs).forEach(function(k){
    var v=d.docs[k],okk=v==='ok'||v.indexOf('uploaded:')===0;if(!okk)ready=false;
    h+='<div class="card"><div class="flex"><b>'+names[k]+'</b><span class="pill '+(okk?'ok':'warn')+'">'+(okk?'added':v==='missing'?'needed':'re-upload needed')+'</span></div>'+(okk?'<div class="muted">'+docLabel(v)+'</div>':'')+(v==='ok'?'':'<label for="doc_'+k+'" style="margin-top:8px">'+(okk?'Replace file':'Choose photo or PDF')+'</label><input id="doc_'+k+'" type="file" data-doc="'+k+'" accept="image/*,.pdf">')+'</div>';
  });
  return h+'<button class="btn" data-act="docSubmit"'+(ready?'':' disabled')+'>Submit for verification</button>';
}
function driver(){
  var wrap=function(x){return '<div class="stage"><div class="phone"><div class="screen">'+x+'</div></div></div>'};
  if(!S.driverId)return wrap(authFlow('driver'));
  var d=drv(S.driverId),h='';
  h+='<div class="drv-top"><div class="flex"><div><b style="font-family:Sora,sans-serif;font-size:18px">'+d.name+'</b><div style="color:#C9D5E4;font-size:13px">'+d.vehicle+' · '+d.reg+'</div></div>'+badge(d.status)+'</div>';
  if(d.status==='VERIFIED')h+='<div class="flex" style="margin-top:14px"><span>'+(S.online?'You are online':'You are offline')+'</span><button class="switch'+(S.online?' on':'')+'" data-act="online" role="switch" aria-checked="'+(!!S.online)+'" aria-label="Go online"></button></div>';
  h+='</div>';
  if(d.status!=='VERIFIED'){
    var need=d.status==='DRAFT'||Object.keys(d.docs).some(function(k){return d.docs[k]==='missing'||d.docs[k]==='re-upload requested'});
    if(d.status==='REJECTED'||d.status==='SUSPENDED')h+='<div class="card empty"><b>You cannot receive rides</b><div class="muted">Only verified drivers can receive rides. Your status is '+d.status.toLowerCase()+'. Contact RR Cabs support.</div></div>';
    else if(need)h+=docsForm(d);
    else h+='<div class="card empty"><b>Documents under review</b><div class="muted">We usually review documents within 24 hours. We will notify you when you are approved.<br><br>In this demo, switch to Admin and approve this driver.</div><button class="btn sm ghost" style="margin-top:10px" data-act="refresh">Check status</button></div>';
    h+='<button class="btn ghost" style="margin-top:8px" data-act="driverOut">Log out</button>';
    return wrap(h);
  }
  var mine=S.bookings.filter(function(b){return b.driverId===S.driverId});
  var earn=mine.filter(function(b){return b.status==='TRIP_COMPLETED'}).reduce(function(a,b){return a+b.driverPay},0);
  var cnt=mine.filter(function(b){return b.status==='TRIP_COMPLETED'}).length;
  h+='<div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><span class="muted">Total earnings</span><span class="big">'+inr(earn)+'</span></div><div class="stat"><span class="muted">Trips done</span><span class="big">'+cnt+'</span></div></div>';
  var act=mine.filter(function(b){return ['ACCEPTED','DRIVER_EN_ROUTE','ARRIVED','TRIP_STARTED'].indexOf(b.status)>-1});
  var req=S.bookings.filter(function(b){return b.status==='REQUESTED'});
  h+='<h3 style="margin:6px 0 8px">Current trips</h3>';
  if(!act.length)h+='<div class="card muted">No active trips. Accepted rides appear here.</div>';
  act.forEach(function(b){
    var nxt={ACCEPTED:['DRIVER_EN_ROUTE','Start driving to pickup'],DRIVER_EN_ROUTE:['ARRIVED','I have arrived'],ARRIVED:['TRIP_STARTED','Start trip'],TRIP_STARTED:['TRIP_COMPLETED','End trip']}[b.status];
    h+='<div class="card"><div class="flex"><b>'+b.from+' → '+b.to+'</b>'+badge(b.status)+'</div><div class="muted">Passenger: '+(b.cust||'Guest')+' · '+nice(b.date)+', '+b.time+' · '+(b.mode==='shared'?b.seats+' seat(s), shared':'personal')+'</div><div class="line"><span>Your earnings</span><b>'+inr(b.driverPay)+'</b></div>'+stepper(b.status)+'<button class="btn" data-act="adv" data-id="'+b.id+'" data-v="'+nxt[0]+'">'+nxt[1]+'</button></div>';
  });

    toast('Ride accepted. The customer has been notified.');log('driver '+S.driverId,'Accepted '+q.id);
  }

    var q2=S.bookings.filter(function(x){return x.id===id})[0];q2.status='CANCELLED';q2.pay='REFUNDED';S.txns.unshift({id:tid(),booking:q2.id,method:q2.method||'UPI',amount:q2.total,status:'REFUNDED',time:now(),type:'REFUND'});

function pay(){
  if(S.busy)return;
  var o=currentOrder(),s=S.search,m=S.pay;
  if(m==='UPI'){var u=val('pm_upi');S.upi=u;if(!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(u)){S.payErr='Enter a valid UPI ID, like name@bank.';render();return}}
  if(m==='Card'){var c=val('pm_card').replace(/\s/g,'');if(!/^\d{16}$/.test(c)||!/^\d{2}\/\d{2}$/.test(val('pm_exp'))||!/^\d{3}$/.test(val('pm_cvv'))){S.payErr='Check the card number (16 digits), expiry (MM/YY) and CVV (3 digits).';render();return}}
  S.payErr='';
  if(o.kind==='ride'){
    var r=o.ride;
    if(r.avail<s.seats){toast('Sorry, only '+r.avail+' seat(s) are left on this ride.');S.step='results';render();return}
    if(S.bookings.some(function(b){return b.rideId===r.id&&b.status!=='CANCELLED'&&!b.seed})){toast('You already have a booking on this ride.');return}
  }
  S.busy=true;
  var t={id:tid(),booking:'—',method:m,amount:o.total,status:'PROCESSING',time:now(),type:'PAYMENT'};
  S.txns.unshift(t);render();
  setTimeout(function(){
    if(S.failTest){t.status='FAILED';S.busy=false;S.step='failed';toast('Payment failed. You have not been charged.');log('customer','Payment '+t.id+' FAILED');render();return}
    if(o.kind==='ride'&&o.ride.avail<s.seats){t.status='FAILED';S.busy=false;toast('Payment not taken. Those seats were just booked by someone else.');S.step='results';render();return}
    if(o.kind==='ride')o.ride.avail-=s.seats;
    var b={id:uid(),mode:o.kind==='personal'?'personal':'shared',from:s.from,to:s.to,date:s.date,time:s.time,seats:o.kind==='personal'?1:s.seats,cat:o.kind==='personal'?S.cat:'',total:o.total,fee:o.fee,driverPay:o.driverPay,
      status:o.kind==='ride'?'ACCEPTED':'REQUESTED',driverId:o.kind==='ride'?o.ride.driver:null,rideId:o.kind==='ride'?o.ride.id:null,pay:'SUCCESS',rated:null,created:Date.now(),cust:S.user.name.split(' ')[0],txnId:t.id,method:m};
    t.status='SUCCESS';t.booking=b.id;
    S.bookings.unshift(b);S.last=b;S.busy=false;S.step='done';S.pick=null;
    log('customer','Booked '+b.id+' ('+b.from+' → '+b.to+'), payment '+t.id+' SUCCESS via '+m);
    toast(o.kind==='ride'?'Shared ride booked. '+drv(b.driverId).name+' has been notified.':'Request sent to verified drivers.');
    render();
  },1400);
}
render();
</script>
</body>
</html>
